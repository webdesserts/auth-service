[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"
authors = ["Michael Mullins"]
license = "Apache-2.0"
repository = "https://github.com/webdesserts/auth-service"
description = "Passkey and API key forward-auth service"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

# WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

# Session management
cookie = { version = "0.18", features = ["signed", "percent-encode"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }

# Storage
bincode = "1"
fs2 = "0.4"
hex = "0.4"
time = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[dev-dependencies]
tempfile = "3"
